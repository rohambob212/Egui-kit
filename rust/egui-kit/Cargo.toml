[package]
name = "egui-kit"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Idiomatic egui.rs port of gpui-kit components, tokens, and 36 editor themes."
keywords = ["egui", "ui", "widgets", "gpui-kit", "theme"]
categories = ["gui"]

[dependencies]
egui = "0.30"

[dev-dependencies]
eframe = "0.30"

