[package]
name = "gallery"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
egui-kit = { path = "../egui-kit", features = ["chart", "table", "dock", "editor"] }
egui.workspace = true
# Base eframe for every target; x11/wayland only make sense on desktop.
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Element"] }
console_error_panic_hook = "0.1"
